<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>First Date · Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            overflow-x: hidden;
        }

        body {
            background-color: #fdeff2;
        }

        /* ========== KEYFRAMES ========== */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(var(--start-deg));
            }

            50% {
                transform: translateY(-20px) rotate(var(--end-deg));
            }
        }

        @keyframes float-drift {
            0% {
                transform: translate(0, 0) rotate(var(--start-deg));
            }

            25% {
                transform: translate(10px, -14px) rotate(var(--end-deg));
            }

            50% {
                transform: translate(0, 0) rotate(var(--start-deg));
            }

            75% {
                transform: translate(-10px, 14px) rotate(var(--end-deg));
            }

            100% {
                transform: translate(0, 0) rotate(var(--start-deg));
            }
        }

        @keyframes float-slow {

            0%,
            100% {
                transform: translateY(0) rotate(var(--start-deg));
            }

            50% {
                transform: translateY(-10px) rotate(var(--end-deg));
            }
        }

        @keyframes heart-glow-breathe {

            0%,
            100% {
                filter: drop-shadow(0 0 2px rgba(201, 24, 74, 0.15));
            }

            50% {
                filter: drop-shadow(0 0 8px rgba(255, 77, 109, 0.45));
            }
        }

        @keyframes bounce-in {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(-100px);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes floatFlowers {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-15px) rotate(5deg);
            }

            50% {
                transform: translateY(0) rotate(0deg);
            }

            75% {
                transform: translateY(15px) rotate(-5deg);
            }

            100% {
                transform: translateY(0) rotate(0deg);
            }
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(110vh) translateX(var(--drift, 0px)) rotate(540deg);
                opacity: 0;
            }
        }

        @keyframes intro-fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes flourish-fade-in {
            from {
                opacity: 0;
                transform: scaleX(0.5);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        @keyframes huh-pop {
            0% {
                opacity: 0;
                transform: translate(-50%, 0) scale(0.6);
            }

            15% {
                opacity: 1;
                transform: translate(-50%, -10px) scale(1);
            }

            60% {
                opacity: 1;
                transform: translate(-50%, -55px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -100px) scale(0.95);
            }
        }

        @keyframes no-wiggle {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-4deg);
            }

            75% {
                transform: rotate(4deg);
            }
        }

        /* ========== INTRO SECTION ========== */
        .intro {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #ff6b9d, #ffc3a0, #ff6b9d, #ffc3a0);
            background-size: 400% 400%;
            animation: gradient-shift 8s ease infinite, intro-fade-in 1s ease-out both;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            isolation: isolate;
        }

        .intro::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.28), transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        .intro::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(120, 20, 60, 0.12) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ========== HEADING GROUP ========== */
        .intro-headings {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            max-width: 900px;
            width: 100%;
        }

        .intro-headings::before {
            content: "";
            position: absolute;
            inset: -5% -15%;
            background: radial-gradient(ellipse at center,
                    rgba(255, 245, 250, 0.55) 0%,
                    rgba(255, 235, 245, 0.3) 45%,
                    transparent 78%);
            filter: blur(24px);
            z-index: -1;
            pointer-events: none;
        }

        /* ========== HEADINGS ========== */
        .intro h1 {
            font-family: 'Playfair Display', Georgia, serif;
            color: #b23a5e;
            z-index: 2;
            position: relative;
            line-height: 1.05;
            animation: bounce-in 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            text-shadow: 0 2px 10px rgba(160, 40, 80, 0.15);
        }

        .intro h1:nth-child(1) {
            font-size: clamp(0.85rem, 2vw, 1.15rem);
            letter-spacing: 0.55em;
            text-transform: uppercase;
            font-weight: 400;
            color: #a84a68;
            margin-bottom: 22px;
            padding-left: 0.55em;
            animation-delay: 0.15s;
        }

        .intro h1:nth-child(2) {
            font-size: clamp(1.4rem, 3.2vw, 2.1rem);
            font-style: italic;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: #a84a68;
            margin-bottom: 4px;
            animation-delay: 0.45s;
        }

        .intro h1:nth-child(3) {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.6rem, 8vw, 5.4rem);
            font-weight: 700;
            letter-spacing: 0;
            color: #b23a5e;
            line-height: 1;
            margin-bottom: 4px;
            text-shadow:
                0 2px 6px rgba(160, 40, 80, 0.18),
                0 4px 20px rgba(200, 90, 130, 0.2);
            animation-delay: 0.75s;
        }

        .title-flourish {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 22px 0 10px;
            color: #c66b87;
            animation: flourish-fade-in 1.2s ease-out 1.5s both;
            transform-origin: center;
        }

        .title-flourish .line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c66b87, transparent);
        }

        .title-flourish .heart {
            font-size: 0.85rem;
            color: #c66b87;
            opacity: 0.85;
        }

        .intro h1:nth-child(4) {
            margin-top: 14px;
            font-size: clamp(1.2rem, 3vw, 2rem);
            letter-spacing: 0.1em;
            font-family: 'Segoe UI', sans-serif;
            animation: bounce-in 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 1.05s both;
            text-shadow: none;
            filter: none;
        }

        /* ========== BUTTONS ========== */
        .intro-buttons {
            display: flex;
            gap: 20px;
            margin-top: 38px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            z-index: 3;
            position: relative;
            width: 100%;
        }

        .btn-pill {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            padding: 14px 38px;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            animation: bounce-in 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 1.35s both;
            min-height: 48px;
            touch-action: manipulation;
        }

        .btn-continue {
            background: linear-gradient(180deg, #d54e77 0%, #b23a5e 100%);
            color: #fff7fa;
            border: none;
            box-shadow:
                0 6px 18px rgba(178, 58, 94, 0.35),
                0 2px 4px rgba(120, 20, 60, 0.2);
        }

        .btn-continue:hover {
            transform: translateY(-3px);
            box-shadow:
                0 12px 26px rgba(178, 58, 94, 0.45),
                0 3px 6px rgba(120, 20, 60, 0.25);
            background: linear-gradient(180deg, #dd5b83 0%, #bd4168 100%);
        }

        .btn-continue:active {
            transform: translateY(-1px);
        }

        .btn-no {
            background: rgba(255, 245, 250, 0.6);
            color: #a84a68;
            border: 1.5px solid rgba(168, 74, 104, 0.55);
            box-shadow: 0 4px 12px rgba(168, 74, 104, 0.15);
            backdrop-filter: blur(6px);
            will-change: top, left;
        }

        .btn-no:hover {
            background: rgba(255, 240, 248, 0.95);
            border-color: rgba(178, 58, 94, 0.85);
            color: #b23a5e;
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(168, 74, 104, 0.25);
        }

        .btn-no.roaming {
            position: fixed;
            z-index: 50;
            transition: top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.25s ease,
                background 0.25s ease;
        }

        .btn-no.wiggle {
            animation: no-wiggle 0.35s ease-in-out;
        }

        .huh-bubble {
            position: fixed;
            transform: translate(-50%, 0);
            color: #b23a5e;
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            font-weight: 700;
            pointer-events: none;
            white-space: nowrap;
            z-index: 100;
            text-shadow: 0 2px 8px rgba(255, 200, 220, 0.9);
            animation: huh-pop 1.6s ease-out forwards;
        }

        /* ========== FLOATING HEARTS ========== */
        .intro-icons span {
            color: rgba(201, 24, 74, 0.386);
            position: absolute;
            z-index: 1;
            cursor: pointer;
            transition: color 0.3s ease, filter 0.3s ease;
            will-change: transform, filter;
            animation:
                float var(--dur, 4s) ease-in-out infinite,
                heart-glow-breathe 4.5s ease-in-out infinite;
        }

        .intro-icons span:hover {
            color: rgba(201, 24, 74, 1);
            filter: drop-shadow(0 0 10px rgba(255, 77, 109, 0.9)) drop-shadow(0 0 20px rgba(255, 105, 180, 0.6));
            z-index: 10;
        }

        .intro-icons span:nth-child(1) {
            top: 15%;
            left: 20%;
            font-size: 40px;
            --start-deg: -30deg;
            --end-deg: -10deg;
            --dur: 4.2s;
            animation-delay: 0s, 0s;
        }

        .intro-icons span:nth-child(2) {
            top: 30%;
            left: 30%;
            font-size: 60px;
            --start-deg: -30deg;
            --end-deg: 0deg;
            --dur: 5s;
            animation: float-drift 5s ease-in-out infinite, heart-glow-breathe 5s ease-in-out infinite;
            animation-delay: 0.2s, 0.4s;
        }

        .intro-icons span:nth-child(3) {
            bottom: 30%;
            right: 20%;
            font-size: 80px;
            --start-deg: -60deg;
            --end-deg: -30deg;
            --dur: 6s;
            animation: float-slow 6s ease-in-out infinite, heart-glow-breathe 5.5s ease-in-out infinite;
            animation-delay: 0.4s, 0.8s;
        }

        .intro-icons span:nth-child(4) {
            top: 30%;
            right: 10%;
            font-size: 50px;
            --start-deg: 60deg;
            --end-deg: 90deg;
            --dur: 4.6s;
        }

        .intro-icons span:nth-child(5) {
            bottom: 30%;
            left: 30px;
            font-size: 100px;
            --start-deg: 30deg;
            --end-deg: 60deg;
            animation: float-drift 6.5s ease-in-out infinite, heart-glow-breathe 6s ease-in-out infinite;
            animation-delay: 0.6s, 1s;
        }

        .intro-icons span:nth-child(6) {
            top: 5%;
            right: 15%;
            font-size: 100px;
            --start-deg: 50deg;
            --end-deg: 20deg;
            animation: float-slow 7s ease-in-out infinite, heart-glow-breathe 6.5s ease-in-out infinite;
            animation-delay: 0s, 0.5s;
        }

        .intro-icons span:nth-child(7) {
            bottom: 15%;
            left: 30%;
            font-size: 80px;
            --start-deg: 50deg;
            --end-deg: 80deg;
            --dur: 4.8s;
            animation-delay: 0.8s, 0.3s;
        }

        .intro-icons span:nth-child(8) {
            top: 40%;
            left: 8%;
            font-size: 45px;
            --start-deg: -20deg;
            --end-deg: 10deg;
            animation: float-drift 5.4s ease-in-out infinite, heart-glow-breathe 5.2s ease-in-out infinite;
            animation-delay: 0.1s, 0.6s;
        }

        .intro-icons span:nth-child(9) {
            bottom: 40%;
            right: 25%;
            font-size: 65px;
            --start-deg: -40deg;
            --end-deg: -10deg;
            --dur: 5.6s;
            animation-delay: 0.3s, 0.9s;
        }

        .intro-icons span:nth-child(10) {
            top: 15%;
            left: 30%;
            font-size: 55px;
            --start-deg: 15deg;
            --end-deg: 45deg;
            --dur: 4.4s;
            animation-delay: 0.5s, 0.2s;
        }

        .intro-icons span:nth-child(11) {
            bottom: 20%;
            right: 8%;
            font-size: 75px;
            --start-deg: -15deg;
            --end-deg: 15deg;
            animation: float-drift 5.8s ease-in-out infinite, heart-glow-breathe 5.5s ease-in-out infinite;
            animation-delay: 0.7s, 1.1s;
        }

        .intro-icons span:nth-child(12) {
            top: 35%;
            right: 20%;
            font-size: 85px;
            --start-deg: -50deg;
            --end-deg: -20deg;
            animation: float-slow 6.8s ease-in-out infinite, heart-glow-breathe 6.2s ease-in-out infinite;
            animation-delay: 0.9s, 0.4s;
        }

        .intro-icons span:nth-child(13) {
            bottom: 45%;
            left: 20%;
            font-size: 65px;
            --start-deg: 25deg;
            --end-deg: 55deg;
            --dur: 5.2s;
            animation-delay: 1.1s, 0.7s;
        }

        /* ========== FLOATING FLOWERS ========== */
        .floating-flowers span {
            position: absolute;
            font-size: 42px;
            opacity: 0.38;
            animation: floatFlowers 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            filter: blur(0.3px);
        }

        .floating-flowers span:nth-child(1) {
            top: 8%;
            left: 5%;
            animation-delay: 0s;
        }

        .floating-flowers span:nth-child(2) {
            top: 18%;
            left: 12%;
            animation-delay: 1s;
        }

        .floating-flowers span:nth-child(3) {
            top: 28%;
            left: 4%;
            animation-delay: 2s;
        }

        .floating-flowers span:nth-child(4) {
            top: 12%;
            right: 6%;
            animation-delay: 0.5s;
        }

        .floating-flowers span:nth-child(5) {
            top: 30%;
            right: 12%;
            animation-delay: 1.5s;
        }

        .floating-flowers span:nth-child(6) {
            top: 45%;
            right: 4%;
            animation-delay: 2.5s;
        }

        .floating-flowers span:nth-child(7) {
            bottom: 15%;
            left: 10%;
            animation-delay: 1s;
        }

        .floating-flowers span:nth-child(8) {
            bottom: 10%;
            right: 8%;
            animation-delay: 2s;
        }

        .floating-flowers span:nth-child(9) {
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 3s;
        }

        .floating-flowers span:nth-child(10) {
            top: 65%;
            left: 35%;
            animation-delay: 2s;
        }

        .floating-flowers span:nth-child(11) {
            top: 70%;
            right: 35%;
            animation-delay: 1.2s;
        }

        /* ========== FALLING PETALS ========== */
        .petal {
            position: absolute;
            top: -10px;
            font-size: 20px;
            pointer-events: none;
            z-index: 0;
            animation: fall linear infinite;
            will-change: transform, opacity;
        }

        /* ========== MOBILE / TABLET ========== */
        @media (max-width: 768px) {
            .intro {
                padding: 30px 16px;
            }

            .intro-headings {
                padding: 20px 8px;
            }

            .intro h1:nth-child(1) {
                letter-spacing: 0.4em;
                padding-left: 0.4em;
                margin-bottom: 16px;
            }

            .title-flourish .line {
                width: 45px;
            }

            .intro-buttons {
                gap: 14px;
                margin-top: 30px;
                flex-direction: column;
                width: 100%;
                max-width: 320px;
            }

            .btn-pill {
                font-size: 1rem;
                padding: 14px 28px;
                width: 100%;
            }

            /* Scale the background decor down for small screens */
            .intro-icons span {
                transform-origin: center;
            }

            .intro-icons span:nth-child(1) {
                font-size: 28px;
            }

            .intro-icons span:nth-child(2) {
                font-size: 38px;
            }

            .intro-icons span:nth-child(3) {
                font-size: 50px;
            }

            .intro-icons span:nth-child(4) {
                font-size: 32px;
            }

            .intro-icons span:nth-child(5) {
                font-size: 60px;
            }

            .intro-icons span:nth-child(6) {
                font-size: 60px;
            }

            .intro-icons span:nth-child(7) {
                font-size: 50px;
            }

            .intro-icons span:nth-child(8) {
                font-size: 30px;
            }

            .intro-icons span:nth-child(9) {
                font-size: 40px;
            }

            .intro-icons span:nth-child(10) {
                font-size: 34px;
            }

            .intro-icons span:nth-child(11) {
                font-size: 46px;
            }

            .intro-icons span:nth-child(12) {
                font-size: 52px;
            }

            .intro-icons span:nth-child(13) {
                font-size: 40px;
            }

            .floating-flowers span {
                font-size: 28px;
                opacity: 0.3;
            }

            .huh-bubble {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 420px) {
            .intro h1:nth-child(3) {
                font-size: 2.4rem;
            }

            .intro-icons span:nth-child(5),
            .intro-icons span:nth-child(6) {
                font-size: 48px;
            }

            .huh-bubble {
                font-size: 1.5rem;
            }
        }

        /* ========== REDUCED MOTION ========== */
        @media (prefers-reduced-motion: reduce) {

            .intro,
            .intro h1,
            .intro-icons span,
            .floating-flowers span,
            .petal {
                animation: none !important;
            }

            .intro h1 {
                opacity: 1;
                transform: none;
                text-shadow: 0 2px 10px rgba(160, 40, 80, 0.2);
            }

            .intro-icons span {
                filter: none;
            }

            .huh-bubble {
                animation-duration: 1.2s;
            }
        }
    </style>
</head>

<body>

    <section class="intro">
        <div class="intro-headings">
            <h1>Welcome</h1>
            <h1>To Our</h1>
            <h1>First Date!</h1>

            <div class="title-flourish">
                <span class="line"></span>
                <span class="heart">❤</span>
                <span class="line"></span>
            </div>

            <h1>❤️❤️❤️❤️❤️</h1>

            <div class="intro-buttons">
                <button class="btn-pill btn-continue" onclick="goToNextPage()">Continue</button>
                <button class="btn-pill btn-no" id="noBtn" onclick="onNoClick(event)">No Jh***</button>
            </div>
        </div>

        <div class="intro-icons">
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
            <span class="bi bi-heart-fill"></span>
        </div>

        <div class="floating-flowers">
            <span>🎀</span>
            <span>🌸</span>
            <span>🌷</span>
            <span>🦋</span>
            <span>🎀</span>
            <span>🌹</span>
            <span>🌺</span>
            <span>🌼</span>
            <span>💮</span>
            <span>🦋</span>
            <span>🎀</span>
            <span>🌻</span>
            <span>🌷</span>
            <span>🌸</span>
            <span>🎀</span>
            <span>🌺</span>
            <span>🌼</span>
        </div>
    </section>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const isMobile = window.matchMedia('(max-width: 768px)').matches;

        /* ========== CONTINUE BUTTON ========== */
        function goToNextPage() {
            window.location.href = 'chapter-two.html';
        }

        /* ========== NO BUTTON — runs away ========== */
        const noBtn = document.getElementById('noBtn');
        const continueBtn = document.querySelector('.btn-continue');

        const reactions = [
            'huhhh🥺',
            'hmm?',
            'Kinaaaa',
            'nooo',
            'please 🥺',
            'NAIIIII',
            'Dinna ma',
            'mandina',
            'ma namanne',
            'aha hudeina',
            'nagarw na🥺🥺',
            'Clickkkk on continueeeeee'
        ];
        let lastReactionIndex = -1;
        let clickCount = 0;

        function onNoClick(e) {
            if (e) e.stopPropagation();

            if (!noBtn.classList.contains('roaming')) {
                const rect = noBtn.getBoundingClientRect();
                noBtn.classList.add('roaming');
                noBtn.style.top = rect.top + 'px';
                noBtn.style.left = rect.left + 'px';
                noBtn.style.margin = '0';
            }

            spawnReaction(noBtn);

            noBtn.classList.remove('wiggle');
            void noBtn.offsetWidth;
            noBtn.classList.add('wiggle');

            moveNoButton();

            clickCount++;
            const scale = Math.max(0.7, 1 - clickCount * 0.035);
            noBtn.style.transform = `scale(${scale})`;

            if (clickCount === 8) {
                setTimeout(() => {
                    noBtn.textContent = 'ok fine 😤';
                }, 400);
            }
        }

        function moveNoButton() {
            const padding = 16;
            const btnW = noBtn.offsetWidth || 160;
            const btnH = noBtn.offsetHeight || 50;
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            const maxX = vw - btnW - padding;
            const maxY = vh - btnH - padding;

            const curX = parseFloat(noBtn.style.left) || 0;
            const curY = parseFloat(noBtn.style.top) || 0;

            // On mobile: restrict the "safe zone" to avoid covering the Continue button
            // and the heading text.
            let safeTop = padding;
            let safeBottom = maxY;
            let safeLeft = padding;
            let safeRight = maxX;

            if (isMobile && continueBtn) {
                const cRect = continueBtn.getBoundingClientRect();
                // No button cannot appear within 20px of the Continue button
                const avoidTop = cRect.top - btnH - 20;
                const avoidBottom = cRect.bottom + 20;
                const avoidLeft = cRect.left - btnW - 20;
                const avoidRight = cRect.right + 20;

                // Pick a random side of the Continue button to keep the no btn away
                // We'll just retry until we land outside the avoid zone.
            }

            let newX, newY, tries = 0;
            do {
                newX = safeLeft + Math.random() * (safeRight - safeLeft);
                newY = safeTop + Math.random() * (safeBottom - safeTop);
                tries++;

                // On mobile, ensure we don't land on top of the continue button
                if (isMobile && continueBtn) {
                    const cRect = continueBtn.getBoundingClientRect();
                    const overlapsContinue =
                        newX < cRect.right + 10 &&
                        newX + btnW > cRect.left - 10 &&
                        newY < cRect.bottom + 10 &&
                        newY + btnH > cRect.top - 10;
                    if (overlapsContinue) continue;
                }
            } while (
                tries < 20 &&
                Math.hypot(newX - curX, newY - curY) < (isMobile ? 100 : 180)
            );

            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        function spawnReaction(btn) {
            const rect = btn.getBoundingClientRect();

            let idx;
            do {
                idx = Math.floor(Math.random() * reactions.length);
            } while (idx === lastReactionIndex && reactions.length > 1);
            lastReactionIndex = idx;

            const bubble = document.createElement('div');
            bubble.className = 'huh-bubble';
            bubble.textContent = reactions[idx];

            bubble.style.left = (rect.left + rect.width / 2) + 'px';
            bubble.style.top = (rect.top - 10) + 'px';

            document.body.appendChild(bubble);
            setTimeout(() => bubble.remove(), 1700);
        }

        /* ========== KEEP NO BUTTON IN VIEW ON RESIZE ========== */
        window.addEventListener('resize', () => {
            if (!noBtn.classList.contains('roaming')) return;
            const padding = 16;
            const btnW = noBtn.offsetWidth;
            const btnH = noBtn.offsetHeight;
            const maxX = window.innerWidth - btnW - padding;
            const maxY = window.innerHeight - btnH - padding;

            let x = parseFloat(noBtn.style.left) || 0;
            let y = parseFloat(noBtn.style.top) || 0;

            x = Math.min(Math.max(x, padding), maxX);
            y = Math.min(Math.max(y, padding), maxY);

            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        /* ========== CONFETTI ON LOAD ========== */
        function fireConfetti() {
            const duration = isMobile ? 2500 : 4000;
            const end = Date.now() + duration;
            const defaults = {
                startVelocity: 28,
                spread: 360,
                ticks: 55,
                zIndex: 0,
                colors: ['#ff0000', '#ff4d4d', '#ff9999', '#ff66b2', '#ff3385']
            };

            const interval = setInterval(() => {
                const timeLeft = end - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                const particleCount = (isMobile ? 25 : 35) * (timeLeft / duration);

                confetti({ ...defaults, particleCount, origin: { x: 0, y: 0.9 }, angle: 60 });
                confetti({ ...defaults, particleCount, origin: { x: 1, y: 0.9 }, angle: 120 });

                if (Math.random() > 0.75) {
                    confetti({
                        ...defaults,
                        particleCount: 18,
                        origin: { x: 0.5, y: 0.5 },
                        spread: 90
                    });
                }
            }, 260);
        }

        /* ========== FALLING PETALS ========== */
        const introEl = document.querySelector('.intro');
        const MAX_PETALS = isMobile ? 14 : 30;
        let petalCount = 0;
        let petalInterval = null;

        function createPetal() {
            if (!introEl) return;
            if (petalCount >= MAX_PETALS) return;

            const petal = document.createElement('div');
            petal.classList.add('petal');

            const flowers = ['🌸', '🌷', '🌺', '🌼', '💮', '🎀', '🦋'];
            petal.textContent = flowers[Math.floor(Math.random() * flowers.length)];

            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = (5 + Math.random() * 4) + 's';
            petal.style.fontSize = (14 + Math.random() * 14) + 'px';
            petal.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');

            introEl.appendChild(petal);
            petalCount++;

            setTimeout(() => {
                petal.remove();
                petalCount--;
            }, 9500);
        }

        function startPetals() {
            if (prefersReducedMotion || petalInterval) return;
            petalInterval = setInterval(createPetal, isMobile ? 700 : 450);
        }

        function stopPetals() {
            clearInterval(petalInterval);
            petalInterval = null;
        }

        if ('IntersectionObserver' in window && introEl) {
            const io = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) startPetals();
                    else stopPetals();
                });
            }, { threshold: 0.15 });
            io.observe(introEl);
        } else {
            startPetals();
        }

        /* ========== HEART CLICK CONFETTI ========== */
        function addHeartClickConfetti() {
            document.querySelectorAll('.intro-icons span').forEach(heart => {
                heart.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (prefersReducedMotion) return;
                    const rect = this.getBoundingClientRect();
                    confetti({
                        particleCount: 28,
                        spread: 45,
                        origin: {
                            x: (rect.left + rect.width / 2) / window.innerWidth,
                            y: (rect.top + rect.height / 2) / window.innerHeight
                        },
                        colors: ['#ff4d6d', '#ff8fa3']
                    });
                });
            });
        }

        /* ========== RANDOM CLICK CONFETTI ========== */
        document.addEventListener('click', (e) => {
            if (prefersReducedMotion) return;
            if (Math.random() > 0.9) {
                confetti({
                    particleCount: 12,
                    spread: 45,
                    origin: {
                        x: e.clientX / window.innerWidth,
                        y: e.clientY / window.innerHeight
                    },
                    colors: ['#ff4d6d', '#ff8fa3']
                });
            }
        });

        /* ========== INIT ========== */
        window.addEventListener('load', () => {
            if (!prefersReducedMotion) fireConfetti();
            addHeartClickConfetti();
        });
    </script>
</body>

</html>
